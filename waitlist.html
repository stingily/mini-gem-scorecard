var e = React.createElement;

function formatElapsed(startedAt, now) {
  var diff = Math.max(0, now - (startedAt || now));
  var m = Math.floor(diff / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function timeAgo(ts, now) {
  var diffMin = Math.floor((now - ts) / 60000);
  if (diffMin <= 0) return "just now";
  if (diffMin === 1) return "1 min ago";
  return diffMin + " min ago";
}

function uid() {
  return "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
}

// Bigger groups take longer: every additional bracket of 6 players adds
// another `minutesPerBracket` to the hole. 1-6 players -> 1x, 7-12 -> 2x, etc.
function groupMinutes(size, minutesPerBracket) {
  return minutesPerBracket * Math.ceil(size / 6);
}

var CSS = "\

  }\

  .subtitle { font-size: 0.78rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.01em; }\

  button:focus-visible, input:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }\
  .pin-row { margin-top: 14px; display: flex; gap: 8px; align-items: center; }\
  .pin-row input { background: var(--pill); border: 1px solid var(--pill-border); border-radius: 12px; padding: 10px 12px; font-family: 'Inter', sans-serif; letter-spacing: 0.2em; width: 100px; font-size: 0.95rem; color: var(--ink); }\
  .pin-row .small-btn { background: var(--brick); color: #fff; border: none; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.03em; text-transform: uppercase; cursor: pointer; }\
  .pin-error { color: var(--brick); font-size: 0.75rem; margin-top: 6px; }\
  .section { padding: 20px 22px; border-bottom: 1px solid var(--divider); }\
  .section-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--label); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; }\
  .section-title .meta { font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 0.74rem; color: var(--muted); }\

  .tee-name { margin-top: 4px; font-size: 1.05rem; font-weight: 700; }\
  .tee-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }\
  .tee-actions { margin-top: 16px; display: flex; gap: 10px; }\
  .btn { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.83rem; letter-spacing: 0.03em; text-transform: uppercase; border-radius: 14px; padding: 13px 18px; border: none; cursor: pointer; }\
  .btn-flag { background: var(--brick); color: #fff; }\

  .queue-remove { background: none; border: none; color: #C9C4BC; font-size: 1rem; cursor: pointer; padding: 4px; line-height: 1; }\
  .queue-remove:hover { color: var(--brick); }\

  .field-label { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; display: block; }\
  .underline-input { width: 100%; border: 1.5px solid var(--pill-border); border-radius: 14px; background: var(--pill); font-family: 'Inter', sans-serif; font-size: 1rem; padding: 13px 14px; color: var(--ink); }\
  .underline-input::placeholder { color: #B3ADA3; }\
  .underline-input:focus { border-color: var(--brick); background: #fff; outline: none; }\

  .loading-banner { padding: 40px 22px; text-align: center; color: var(--muted); font-size: 0.9rem; }\

function MiniGemWaitlist() {
  var queueState = useState([]);
  var queue = queueState[0], setQueue = queueState[1];

  var nowPlayingState = useState(null);
  var nowPlaying = nowPlayingState[0], setNowPlaying = nowPlayingState[1];

  var minutesState = useState(5);
  var minutesPerGroup = minutesState[0], setMinutesPerGroup = minutesState[1];

  var loadingState = useState(true);
  var loading = loadingState[0], setLoading = loadingState[1];

  var storageErrorState = useState(null);
  var storageError = storageErrorState[0], setStorageError = storageErrorState[1];

  var tickState = useState(0);
  var setTick = tickState[1];

  var joinNameState = useState("");
  var joinName = joinNameState[0], setJoinName = joinNameState[1];

  var joinSizeState = useState(2);
  var joinSize = joinSizeState[0], setJoinSize = joinSizeState[1];

  var joinNoteState = useState("");
  var joinNote = joinNoteState[0], setJoinNote = joinNoteState[1];

  var joinedIdState = useState(null);
  var joinedId = joinedIdState[0], setJoinedId = joinedIdState[1];

  var joinErrorState = useState("");
  var joinError = joinErrorState[0], setJoinError = joinErrorState[1];

  var isStaffState = useState(false);
  var isStaff = isStaffState[0], setIsStaff = isStaffState[1];

  var showPinEntryState = useState(false);
  var showPinEntry = showPinEntryState[0], setShowPinEntry = showPinEntryState[1];

  var pinValueState = useState("");
  var pinValue = pinValueState[0], setPinValue = pinValueState[1];

  var pinErrorState = useState(false);
  var pinError = pinErrorState[0], setPinError = pinErrorState[1];

  var confirmResetState = useState(false);
  var confirmReset = confirmResetState[0], setConfirmReset = confirmResetState[1];

  var mounted = useRef(true);

  useEffect(function () {
    mounted.current = true;
    var everySecond = setInterval(function () { setTick(function (t) { return t + 1; }); }, 1000);

    if (!CONFIGURED || !db) {
      setLoading(false);
      return function () {
        mounted.current = false;
        clearInterval(everySecond);
      };
    }

    var queueRef = db.ref("queue");
    var nowPlayingRef = db.ref("nowPlaying");
    var settingsRef = db.ref("settings/minutesPerGroup");

    function onQueue(snap) {
      if (!mounted.current) return;
      var val = snap.val() || {};
      var arr = Object.keys(val).map(function (id) {
        return Object.assign({ id: id }, val[id]);
      });
      arr.sort(function (a, b) { return (a.addedAt || 0) - (b.addedAt || 0); });
      setQueue(arr);
      setLoading(false);
      setStorageError(null);
    }
    function onNowPlaying(snap) {
      if (!mounted.current) return;
      setNowPlaying(snap.val());
    }
    function onSettings(snap) {
      if (!mounted.current) return;
      var v = snap.val();
      if (typeof v === "number") setMinutesPerGroup(v);
    }
    function onErr() {
      if (!mounted.current) return;
      setStorageError("Lost connection to the database. Showing the last known list.");
      setLoading(false);
    }

    queueRef.on("value", onQueue, onErr);
    nowPlayingRef.on("value", onNowPlaying, onErr);
    settingsRef.on("value", onSettings, onErr);

    return function () {
      mounted.current = false;
      clearInterval(everySecond);
      queueRef.off("value", onQueue);
      nowPlayingRef.off("value", onNowPlaying);
      settingsRef.off("value", onSettings);
    };
  }, []);

  function handleJoin() {
    var name = joinName.trim();
    if (!name) {
      setJoinError("Enter a name for the list.");
      return;
    }
    if (name.length > 40) {
      setJoinError("Keep the name under 40 characters.");
      return;
    }
    setJoinError("");
    var note = joinNote.trim().slice(0, 80);

    if (CONFIGURED && db) {
      var entry = {
        name: name,
        size: joinSize,
        note: note,
        addedAt: firebase.database.ServerValue.TIMESTAMP,
      };
      var newRef = db.ref("queue").push(entry);
      setJoinedId(newRef.key);
      Promise.resolve(newRef).catch(function () {
        setStorageError("Couldn't save your spot. Check your connection and try again.");
      });
    } else {
      var localEntry = { id: uid(), name: name, size: joinSize, note: note, addedAt: Date.now() };
      setQueue(function (q) { return q.concat([localEntry]); });
      setJoinedId(localEntry.id);
    }
    setJoinName("");
    setJoinNote("");
    setJoinSize(2);
  }

  function callNext() {
    if (queue.length === 0) return;
    var next = queue[0];
    var id = next.id;
    var payload = { name: next.name, size: next.size, note: next.note || "" };
    if (CONFIGURED && db) {
      db.ref("nowPlaying")
        .set(Object.assign({}, payload, { startedAt: firebase.database.ServerValue.TIMESTAMP }))
        .catch(function () { setStorageError("Couldn't update the tee status."); });
      db.ref("queue/" + id)
        .remove()
        .catch(function () { setStorageError("Couldn't update the list."); });
    } else {
      setNowPlaying(Object.assign({}, payload, { startedAt: Date.now() }));
      setQueue(function (q) { return q.slice(1); });
    }
  }

  function finishNow() {
    if (CONFIGURED && db) {
      db.ref("nowPlaying").remove().catch(function () { setStorageError("Couldn't clear the tee status."); });
    } else {
      setNowPlaying(null);
    }
  }

  function removeFromQueue(id) {
    if (CONFIGURED && db) {
      db.ref("queue/" + id).remove().catch(function () { setStorageError("Couldn't update the list."); });
    } else {
      setQueue(function (q) { return q.filter(function (p) { return p.id !== id; }); });
    }
  }

  function resetEverything() {
    if (CONFIGURED && db) {
      db.ref("queue").remove();
      db.ref("nowPlaying").remove();
    } else {
      setQueue([]);
      setNowPlaying(null);
    }
    setConfirmReset(false);
  }

  function persistSettings(mins) {
    setMinutesPerGroup(mins);
    if (CONFIGURED && db) {
      db.ref("settings/minutesPerGroup")
        .set(mins)
        .catch(function () { setStorageError("Couldn't save settings."); });
    }
  }

  function submitPin() {
    if (pinValue === STAFF_PIN) {
      setIsStaff(true);
      setShowPinEntry(false);
      setPinValue("");
      setPinError(false);
    } else {
      setPinError(true);
    }
  }

  var elapsedMin = nowPlaying ? (Date.now() - nowPlaying.startedAt) / 60000 : 0;
  var remainingCurrent = nowPlaying
    ? Math.max(groupMinutes(nowPlaying.size, minutesPerGroup) - elapsedMin, 1)
    : 0;

  function estimateFor(index) {
    if (!nowPlaying && index === 0) return 0;
    var total = nowPlaying ? remainingCurrent : 0;
    for (var k = 0; k < index; k++) {
      total += groupMinutes(queue[k].size, minutesPerGroup);
    }
    return Math.round(total);
  }

  var children = [];

  children.push(e('style', { key: 'style' }, CSS));

  var sheetChildren = [];

  sheetChildren.push(e('div', { className: 'topbar', key: 'topbar' }));

  sheetChildren.push(
    e('div', { className: 'header', key: 'header' },
      e('div', { className: 'brand-row' },
        e('img', { src: LOGO_URL, alt: 'Mini Gem', className: 'logo-img' }),
        e('div', null,
          e('div', { className: 'wordmark' }, 'WAITLIST'),
          e('div', { className: 'subtitle' }, 'Gem Lake Hills · White Bear Lake, MN')
        )
      )
    )
  );

  if (!CONFIGURED) {
    sheetChildren.push(
      e('div', { className: 'config-banner', key: 'configbanner' },
        "Demo mode — Firebase isn't connected yet. Edit ",
        e('code', null, 'firebaseConfig'),
        " near the top of this file, then refresh. Until then, nothing here is shared or saved."
      )
    );
  }

  if (storageError) {
    sheetChildren.push(e('div', { className: 'error-banner', key: 'errbanner' }, storageError));
  }

  if (loading) {
    sheetChildren.push(e('div', { className: 'loading-banner', key: 'loadingbanner' }, 'Reading the tee sheet…'));
  } else {
    // On the tee
    var teeInner;
    if (nowPlaying) {
      var teeActionsChildren = [];
      if (isStaff) {
        teeActionsChildren.push(
          e('div', { className: 'tee-actions', key: 'teeactions' },
            e('button', { className: 'btn btn-flag', onClick: finishNow }, 'Finish & clear')
          )
        );
      }
      teeInner = [
        e('div', { className: 'tee-clock', key: 'clock' }, formatElapsed(nowPlaying.startedAt, Date.now())),
        e('div', { className: 'tee-name', key: 'name' },
          nowPlaying.name + ' · ' + nowPlaying.size + ' ' + (nowPlaying.size === 1 ? 'player' : 'players')
        )
      ];
      if (nowPlaying.note) {
        teeInner.push(e('div', { className: 'tee-sub', key: 'note' }, nowPlaying.note));
      }
      teeInner = teeInner.concat(teeActionsChildren);
    } else {
      teeInner = [e('div', { className: 'tee-empty', key: 'empty' }, "No one's on the tee right now.")];
      if (isStaff) {
        teeInner.push(
          e('div', { className: 'tee-actions', key: 'teeactions' },
            e('button', {
              className: 'btn btn-flag',
              onClick: callNext,
              disabled: queue.length === 0
            }, 'Call next')
          )
        );
      }
    }

    sheetChildren.push(
      e('div', { className: 'section', key: 'teesection' },
        e('div', { className: 'section-title' }, 'On the tee'),
        e('div', { className: 'tee-card' }, teeInner)
      )
    );

    // The list
    var listInner;
    if (queue.length === 0) {
      listInner = e('div', { className: 'queue-empty' }, "The tee sheet's open — be the first to join.");
    } else {
      listInner = e('div', null, queue.map(function (p, i) {
        var est = estimateFor(i);
        return e('div', { className: 'queue-row' + (p.id === joinedId ? ' mine' : ''), key: p.id },
          e('div', { className: 'queue-num' }, String(i + 1).padStart(2, '0')),
          e('div', null,
            e('div', { className: 'queue-name' },
              p.name,
              p.id === joinedId ? e('span', { className: 'you-tag' }, 'You') : null
            ),
            e('div', { className: 'queue-meta' },
              p.size + ' ' + (p.size === 1 ? 'player' : 'players') +
              (p.note ? ' · ' + p.note : '') + ' · added ' + timeAgo(p.addedAt, Date.now())
            )
          ),
          e('div', { className: 'queue-wait' }, est <= 0 ? 'Up next' : '~' + est + ' min'),
          isStaff
            ? e('button', {
                className: 'queue-remove',
                'aria-label': 'Remove ' + p.name,
                onClick: function () { removeFromQueue(p.id); }
              }, '✕')
            : e('span', null)
        );
      }));
    }

    var listSectionChildren = [
      e('div', { className: 'section-title', key: 'title' },
        'The list',
        e('span', { className: 'meta' }, '~' + minutesPerGroup + ' min per 6 players')
      ),
      e(React.Fragment, { key: 'list' }, listInner)
    ];
    if (isStaff && queue.length > 0) {
      listSectionChildren.push(
        e('div', { style: { marginTop: 12 }, key: 'callnext' },
          e('button', { className: 'btn btn-outline', onClick: callNext }, 'Call next')
        )
      );
    }
    sheetChildren.push(e('div', { className: 'section', key: 'listsection' }, listSectionChildren));

    // Join the list
    var joinChildren = [
      e('div', { className: 'section-title', key: 'title' }, 'Join the list')
    ];
    if (joinError) {
      joinChildren.push(e('div', { className: 'join-error', key: 'err' }, joinError));
    }
    joinChildren.push(
      e('div', { className: 'field', key: 'namefield' },
        e('label', { className: 'field-label' }, 'Name'),
        e('input', {
          className: 'underline-input',
          placeholder: 'e.g. Wang party',
          value: joinName,
          onChange: function (ev) { setJoinName(ev.target.value); setJoinedId(null); },
          onKeyDown: function (ev) { if (ev.key === 'Enter') handleJoin(); },
          maxLength: 40
        })
      )
    );
    joinChildren.push(
      e('div', { className: 'field', key: 'sizefield' },
        e('label', { className: 'field-label' }, 'Party size'),
        e('div', { className: 'stepper' },
          e('button', {
            onClick: function () { setJoinSize(function (s) { return Math.max(1, s - 1); }); },
            disabled: joinSize <= 1,
            'aria-label': 'Decrease party size'
          }, '−'),
          e('span', { className: 'count' }, joinSize),
          e('button', {
            onClick: function () { setJoinSize(function (s) { return Math.min(20, s + 1); }); },
            disabled: joinSize >= 20,
            'aria-label': 'Increase party size'
          }, '+')
        ),
        e('div', { className: 'size-hint' }, 'Max 20 per group. Bigger group? Submit it as two separate entries on the list.')
      )
    );
    joinChildren.push(
      e('div', { className: 'field', key: 'notefield' },
        e('label', { className: 'field-label' }, 'Note (optional)'),
        e('input', {
          className: 'underline-input',
          placeholder: 'e.g. ask for Pat, cart #3',
          value: joinNote,
          onChange: function (ev) { setJoinNote(ev.target.value); },
          maxLength: 80,
          onKeyDown: function (ev) { if (ev.key === 'Enter') handleJoin(); }
        })
      )
    );
    joinChildren.push(
      e('button', { className: 'btn btn-flag', onClick: handleJoin, key: 'joinbtn' }, 'Join the list →')
    );
    if (joinedId && queue.some(function (p) { return p.id === joinedId; })) {
      var spot = queue.findIndex(function (p) { return p.id === joinedId; }) + 1;
      joinChildren.push(
        e('div', { className: 'join-confirm', key: 'confirm' }, "You're on the list — spot #" + spot + ".")
      );
    }
    sheetChildren.push(e('div', { className: 'section', key: 'joinsection' }, joinChildren));

    // Staff section
    if (isStaff) {
      sheetChildren.push(
        e('div', { className: 'section', key: 'staffsection' },
          e('div', { className: 'section-title' },
            'Staff settings',
            e('span', { className: 'meta' },
              e('button', { className: 'exit-link', onClick: function () { setIsStaff(false); } }, 'Exit staff mode')
            )
          ),
          e('div', { className: 'staff-panel' },
            e('div', { className: 'row' },
              e('span', { className: 'staff-label' }, 'Minutes per 6 players'),
              e('div', { className: 'stepper' },
                e('button', {
                  onClick: function () { persistSettings(Math.max(2, minutesPerGroup - 1)); },
                  'aria-label': 'Decrease minutes per group'
                }, '−'),
                e('span', { className: 'count' }, minutesPerGroup),
                e('button', {
                  onClick: function () { persistSettings(Math.min(30, minutesPerGroup + 1)); },
                  'aria-label': 'Increase minutes per group'
                }, '+')
              )
            ),
            e('div', { className: 'row' },
              e('span', { className: 'staff-label' }, 'Reset list & tee status'),
              confirmReset
                ? e('div', { className: 'reset-confirm' },
                    e('span', null, 'Sure?'),
                    e('button', { className: 'btn btn-flag', onClick: resetEverything }, 'Yes, reset'),
                    e('button', { className: 'btn btn-ghost', onClick: function () { setConfirmReset(false); } }, 'Cancel')
                  )
                : e('button', { className: 'btn btn-outline', onClick: function () { setConfirmReset(true); } }, 'Reset')
            )
          )
        )
      );
    } else {
      var staffEntryChildren = [
        e('div', { className: 'section-title', key: 'title' }, 'Staff')
      ];
      if (!showPinEntry) {
        staffEntryChildren.push(
          e('button', { className: 'staff-btn', onClick: function () { setShowPinEntry(true); }, key: 'signin' }, 'Staff sign-in')
        );
      } else {
        staffEntryChildren.push(
          e('div', { key: 'pinblock' },
            e('div', { className: 'pin-row' },
              e('input', {
                type: 'password',
                inputMode: 'numeric',
                placeholder: 'PIN',
                value: pinValue,
                onChange: function (ev) { setPinValue(ev.target.value); setPinError(false); },
                onKeyDown: function (ev) { if (ev.key === 'Enter') submitPin(); },
                autoFocus: true
              }),
              e('button', { className: 'small-btn', onClick: submitPin }, 'Enter'),
              e('button', {
                className: 'staff-btn',
                onClick: function () { setShowPinEntry(false); setPinValue(''); setPinError(false); }
              }, 'Cancel')
            ),
            pinError ? e('div', { className: 'pin-error' }, "That's not the staff PIN.") : null
          )
        );
      }
      sheetChildren.push(e('div', { className: 'section staff-entry', key: 'staffentry' }, staffEntryChildren));
    }

    sheetChildren.push(
      e('div', { className: 'footer-note', key: 'footer' },
        CONFIGURED
          ? 'This list is shared — everyone viewing this page sees the same queue.'
          : "Demo mode — see the banner above. Changes here won't be saved or shared."
      )
    );
  }

  children.push(e('div', { className: 'sheet', key: 'sheet' }, sheetChildren));

  return e('div', { className: 'shell' }, children);
}

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(MiniGemWaitlist));

})();
</script>
</body>
</html>
